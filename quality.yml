# Quality configuration for this service. Owned by the QA Guild (see CODEOWNERS).
# The gates read their thresholds from here: mutation_score_min (stryker.config.mjs) and the PR size limits
# (scripts/pr-size.mjs). tier, risk_check and waivers are declared for the Guild to review; this demo has one
# Tier 1 service, so every gate always runs. Switching gates on by tier is part of the strategy, not built here.
tier: 1
standard_version: 1.0.0
gates:
  mutation_score_min: 80   # on changed code; Tier 1 standard
  risk_check: true         # every risk in risks.yml has a test naming it
  pr_size_warn: 400        # changed lines; above this the PR gets a warning
  pr_size_max: 1000        # above this the PR needs a "Large PR: <reason>" line in its description
waivers: []                # e.g. { gate: mutation, reason: "...", approved_by: "...", expires: 2026-12-31 }
